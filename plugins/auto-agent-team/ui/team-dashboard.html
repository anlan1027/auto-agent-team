<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Auto Agent Team</title>
<style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--line:color-mix(in srgb,CanvasText 13%,transparent);--soft:color-mix(in srgb,CanvasText 6%,transparent);--softer:color-mix(in srgb,CanvasText 3%,transparent);--green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--slate:#94a3b8}
*{box-sizing:border-box}body{margin:0;background:transparent;color:CanvasText}.panel{max-width:860px;margin:0 auto;padding:14px}.card{border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,Canvas 96%,CanvasText 4%);overflow:hidden}.header,.section{padding:15px 18px;border-bottom:1px solid var(--line)}.header{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.title{font-size:18px;font-weight:760}.sub,.meta,.detail,.event,.footer{font-size:10.5px;opacity:.66;line-height:1.45}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill,.status{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10.5px;background:var(--softer)}.dot{width:8px;height:8px;border-radius:50%;background:var(--slate)}.dot.running{background:var(--green)}.dot.completed{background:var(--blue)}.dot.blocked{background:var(--red)}.btn{border:1px solid var(--line);background:transparent;color:inherit;border-radius:9px;padding:6px 9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.metric{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.metric b{display:block;font-size:18px}.metric span{font-size:10.5px;opacity:.62}.progress{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}.section-title{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-bottom:10px}.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stage{padding:9px;border:1px solid var(--line);border-radius:11px;text-align:center;font-size:11px;opacity:.55}.stage.done{opacity:.9;border-color:color-mix(in srgb,var(--green) 45%,var(--line))}.stage.active{opacity:1;border-color:color-mix(in srgb,var(--blue) 55%,var(--line))}.members,.tasks{display:grid;gap:8px}.member,.task{border:1px solid var(--line);border-radius:12px;background:var(--softer);padding:10px 11px}.member-head,.task-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.name{font-size:12px;font-weight:680}.role{font-size:10px;opacity:.58;margin-top:2px}.task-id{font:650 10.5px ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.62;margin-right:7px}.task-title{font-size:12px;font-weight:650}.dep{display:inline-flex;margin:3px 4px 0 0;padding:2px 6px;border-radius:7px;background:var(--soft)}.result{margin-top:7px;padding:7px 8px;border-radius:9px;background:var(--soft);font-size:10.5px;line-height:1.5}.blocked{background:color-mix(in srgb,var(--red) 10%,transparent)}.signals{display:grid;grid-template-columns:1fr 1fr;gap:9px}.signal{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--softer)}.signal h4{font-size:11px;margin:0 0 7px}.signal-item{font-size:10.5px;padding:6px 0;border-top:1px solid var(--line)}.signal-item:first-of-type{border-top:0}.event{padding:5px 0;border-top:1px solid var(--line)}.event:first-of-type{border-top:0}.footer{padding:9px 18px;display:flex;justify-content:space-between}.empty{font-size:11px;opacity:.62}.section:last-child{border-bottom:0}@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}.stages{overflow-x:auto;grid-template-columns:repeat(5,minmax(72px,1fr))}.signals{grid-template-columns:1fr}.header{flex-direction:column}}
</style>
</head>
<body>
<div class="panel"><div class="card" id="app"><div class="section">正在等待 Agent Team 状态…</div></div></div>
<script>
const app=document.getElementById("app");const pending=new Map();let nextId=1;let workspacePath=null;
const statusMap={idle:["等待中","○"],working:["执行中","●"],blocked:["受阻","!"],done:["已完成","✓"],failed:["失败","×"],pending:["等待依赖","○"],ready:["可执行","◆"],running:["执行中","●"]};
const phaseMap={planning:"计划",running:"执行",integrating:"整合",verifying:"验证",reviewing:"审查",completed:"完成",blocked:"受阻"};
const modeMap={NATIVE_SUBAGENTS:["原生多 Agent","🟢"],SEQUENTIAL_ROLE_FALLBACK:["顺序执行模式","🟡"],UNKNOWN:["执行模式确认中","⚪"]};
const kindMap={requirements:"需求",research:"调研",architecture:"架构",implementation:"实现",integration:"整合",verification:"验证",test:"测试",testing:"测试",regression:"回归测试",review:"审查",code_review:"审查",re_review:"复审",debug:"调试",task:"任务"};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function request(method,params){const id=nextId++;window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));}
function chip(s){const [label,icon]=statusMap[s]||[s||"未知","○"];return `<span class="status">${icon} ${esc(label)}</span>`;}
function fmt(v){if(!v)return"";try{return new Intl.DateTimeFormat("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date(v));}catch{return String(v)}}
function roleText(m){const n=String(m.name||m.id||"").trim().toLowerCase();const r=String(m.role||"").trim();return r&&r.toLowerCase()!==n?r:"";}
function stages(phase){const defs=["计划","执行","验证","审查","完成"];const idx={planning:0,running:1,integrating:1,verifying:2,reviewing:3,completed:4,blocked:1}[phase]??0;return defs.map((x,i)=>`<div class="stage ${i<idx?"done":""} ${i===idx?"active":""}">${i<idx?"✓":i+1}<br>${x}</div>`).join("");}
function signal(items){if(!items.length)return'<div class="empty">暂无结果</div>';return items.map(t=>`<div class="signal-item"><b>${esc(t.id)} · ${esc(t.subject||t.objective)}</b><div>${chip(t.status)} ${t.result?esc(t.result):""}</div>${t.evidence?.length?`<div class="detail">证据：${t.evidence.map(esc).join(" · ")}</div>`:""}</div>`).join("");}
function render(data){const team=data?.team??data;if(!team){app.innerHTML='<div class="section empty">尚未创建团队状态。</div>';return;}workspacePath=data?.workspacePath??workspacePath;const members=team.members||[];const tasks=team.tasks||[];const events=team.events||[];const done=tasks.filter(t=>t.status==="done").length;const working=members.filter(m=>m.status==="working").length;const pct=tasks.length?Math.round(done/tasks.length*100):0;const mode=modeMap[team.executionMode]||modeMap.UNKNOWN;const verification=tasks.filter(t=>["verification","test","testing","regression"].includes(t.kind));const reviews=tasks.filter(t=>["review","code_review","re_review"].includes(t.kind));const blockers=tasks.filter(t=>["blocked","failed"].includes(t.status));
app.innerHTML=`<div class="header"><div><div class="title">${esc(team.name||"Auto Agent Team")}</div><div class="sub">${esc(team.description||"自动编排、依赖调度、验证与审查状态")}</div></div><div class="toolbar"><span class="pill"><span class="dot ${esc(team.phase)}"></span>${esc(phaseMap[team.phase]||team.phase)}</span><button class="btn" id="refresh">刷新</button></div></div>
<div class="section"><div class="grid"><div class="metric"><b>${members.length}</b><span>团队成员</span></div><div class="metric"><b>${working}</b><span>执行中</span></div><div class="metric"><b>${done}/${tasks.length}</b><span>任务完成</span></div><div class="metric"><b style="font-size:13px">${mode[1]} ${esc(mode[0])}</b><span>执行模式</span></div></div><div class="detail" style="margin-top:10px"><b>总体进度 ${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div></div>
<div class="section"><div class="section-title"><span>执行阶段</span><span class="meta">${esc(phaseMap[team.phase]||team.phase)}</span></div><div class="stages">${stages(team.phase)}</div></div>
<div class="section"><div class="section-title"><span>成员与状态</span><span class="meta">${working} 个正在执行</span></div><div class="members">${members.length?members.map(m=>`<div class="member"><div class="member-head"><div><div class="name">${esc(m.name||m.id)}</div>${roleText(m)?`<div class="role">${esc(roleText(m))}${m.agentProfile?` · ${esc(m.agentProfile)}`:""}</div>`:(m.agentProfile?`<div class="role">${esc(m.agentProfile)}</div>`:"")}</div>${chip(m.status)}</div><div class="detail">当前任务：${m.currentTask?esc(m.currentTask):"暂无"}${m.summary?` · ${esc(m.summary)}`:""}</div></div>`).join(""):'<div class="empty">暂无成员</div>'}</div></div>
<div class="section"><div class="section-title"><span>任务与依赖</span><span class="meta">${tasks.length} 个任务</span></div><div class="tasks">${tasks.length?tasks.map(t=>`<div class="task"><div class="task-head"><div><span class="task-id">${esc(t.id)}</span><span class="task-title">${esc(t.subject||t.objective)}</span></div>${chip(t.status)}</div><div class="detail">负责人：${esc(t.assignee||"未分配")} · ${esc(kindMap[t.kind]||t.kind||"任务")}</div>${t.dependencies?.length?`<div class="detail">依赖：${t.dependencies.map(d=>`<span class="dep">← ${esc(d)}</span>`).join("")}</div>`:""}${t.blockedBy?.length?`<div class="result blocked">被依赖阻塞：${t.blockedBy.map(esc).join("、")}</div>`:""}${t.result?`<div class="result"><b>结果：</b>${esc(t.result)}${t.evidence?.length?`<div class="detail">证据：${t.evidence.map(esc).join(" · ")}</div>`:""}</div>`:""}</div>`).join(""):'<div class="empty">暂无任务</div>'}</div></div>
${blockers.length?`<div class="section"><div class="section-title"><span>阻塞与失败</span><span class="meta">${blockers.length}</span></div>${blockers.map(t=>`<div class="result blocked"><b>${esc(t.id)} · ${esc(t.subject)}</b><div>${esc(t.result||"需要处理")}</div></div>`).join("")}</div>`:""}
<div class="section"><div class="section-title"><span>验证与审查</span><span class="meta">工程证据</span></div><div class="signals"><div class="signal"><h4>测试 / Verification</h4>${signal(verification)}</div><div class="signal"><h4>Review / Re-review</h4>${signal(reviews)}</div></div></div>
<div class="section"><div class="section-title"><span>最近活动</span><span class="meta">自动刷新</span></div>${events.length?events.slice(-10).reverse().map(e=>`<div class="event">${esc(fmt(e.at))} · ${esc(e.message||e.kind||"")}</div>`).join(""):'<div class="empty">暂无事件</div>'}</div><div class="footer"><span>Auto Agent Team Runtime</span><span>更新时间 ${esc(fmt(team.updatedAt))}</span></div>`;document.getElementById("refresh")?.addEventListener("click",refresh);}
async function refresh(){if(!workspacePath)return;try{const r=await request("tools/call",{name:"agent_team_get",arguments:{workspacePath}});if(r?.structuredContent)render(r.structuredContent);}catch(e){console.error(e)}}
window.addEventListener("message",event=>{if(event.source!==window.parent)return;const msg=event.data;if(!msg||msg.jsonrpc!=="2.0")return;if(msg.id!==undefined&&pending.has(msg.id)){const p=pending.get(msg.id);pending.delete(msg.id);msg.error?p.reject(msg.error):p.resolve(msg.result);return;}if(msg.method==="ui/notifications/tool-input")workspacePath=msg.params?.workspacePath??workspacePath;if(msg.method==="ui/notifications/tool-result"&&msg.params?.structuredContent)render(msg.params.structuredContent);},{passive:true});
if(window.openai?.toolOutput)render(window.openai.toolOutput);setInterval(()=>{if(workspacePath)refresh();},3000);
</script>
</body>
</html>
