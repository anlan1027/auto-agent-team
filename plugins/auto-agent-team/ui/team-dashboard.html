<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Auto Agent Team</title>
<style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--line:color-mix(in srgb,CanvasText 13%,transparent);--soft:color-mix(in srgb,CanvasText 6%,transparent);--softer:color-mix(in srgb,CanvasText 3%,transparent);--muted:color-mix(in srgb,CanvasText 60%,transparent);--green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--slate:#94a3b8}
*{box-sizing:border-box}body{margin:0;background:transparent;color:CanvasText}.panel{max-width:860px;margin:0 auto;padding:14px}.card{border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,Canvas 96%,CanvasText 4%);overflow:hidden;box-shadow:0 10px 30px color-mix(in srgb,#000 10%,transparent)}
.header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:18px;border-bottom:1px solid var(--line)}.title{font-weight:760;font-size:18px;letter-spacing:-.01em}.sub{font-size:12px;opacity:.68;margin-top:4px;max-width:590px;line-height:1.5}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;background:var(--softer)}.dot{width:8px;height:8px;border-radius:50%;background:var(--slate);box-shadow:0 0 0 3px color-mix(in srgb,var(--slate) 16%,transparent)}.dot.running,.dot.working{background:var(--green)}.dot.completed,.dot.done{background:var(--blue)}.dot.blocked,.dot.failed{background:var(--red)}.dot.ready{background:var(--amber)}
.section{padding:15px 18px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700;margin:0 0 11px}.section-title small{font-weight:500;opacity:.58}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.metric{padding:11px;border-radius:12px;background:var(--soft);border:1px solid color-mix(in srgb,CanvasText 7%,transparent)}.metric b{display:block;font-size:18px;line-height:1.1}.metric span{font-size:11px;opacity:.62}.mode b{font-size:13px;line-height:1.3}
.progress-wrap{margin-top:12px}.progress-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-bottom:6px}.progress-top span:last-child{opacity:.62}.progress{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}.progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .3s ease}
.stage-track{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stage{position:relative;padding:9px 8px;border:1px solid var(--line);border-radius:11px;background:var(--softer);font-size:11px;text-align:center;opacity:.55}.stage.active{opacity:1;border-color:color-mix(in srgb,var(--blue) 55%,var(--line));background:color-mix(in srgb,var(--blue) 10%,Canvas)}.stage.done{opacity:.9;border-color:color-mix(in srgb,var(--green) 45%,var(--line))}.stage .num{display:block;font-size:10px;opacity:.65;margin-bottom:2px}
.member-list{display:grid;gap:8px}.member{border:1px solid var(--line);border-radius:12px;background:var(--softer);overflow:hidden}.member summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(100px,1fr) auto;align-items:center;gap:9px;padding:10px 11px}.member summary::-webkit-details-marker{display:none}.avatar{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--soft);font-size:13px;font-weight:750}.name{font-weight:650;font-size:12px}.meta{font-size:10.5px;opacity:.62;margin-top:2px;line-height:1.4}.status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;border-radius:999px;padding:4px 7px;background:var(--soft);white-space:nowrap}.member-body{padding:0 11px 10px 48px;font-size:11px;line-height:1.55}.member-body b{font-weight:650}
.task-list{display:grid;gap:8px}.task{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--softer)}.task-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}.task-id{font:650 10.5px ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.62}.task-subject{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-detail{font-size:10.5px;opacity:.65;margin-top:5px;line-height:1.5}.dep{display:inline-flex;margin:3px 4px 0 0;padding:2px 6px;border-radius:7px;background:var(--soft);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.blocked-note{margin-top:7px;padding:7px 8px;border-radius:9px;background:color-mix(in srgb,var(--red) 10%,transparent);font-size:10.5px}.result{margin-top:7px;padding:7px 8px;border-radius:9px;background:var(--soft);font-size:10.5px;line-height:1.5}.evidence{margin-top:4px;opacity:.68}
.signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.signal{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--softer)}.signal h4{font-size:11px;margin:0 0 7px}.signal .empty{padding:0}.signal-item{font-size:10.5px;line-height:1.45;padding:6px 0;border-top:1px solid var(--line)}.signal-item:first-of-type{border-top:0}.signal-item strong{font-size:11px}
.event-list{position:relative;margin-left:5px}.event{position:relative;font-size:10.5px;padding:6px 0 6px 16px;line-height:1.45}.event:before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--slate)}.event:after{content:"";position:absolute;left:2.5px;top:17px;bottom:-6px;width:1px;background:var(--line)}.event:last-child:after{display:none}.event time{opacity:.52;margin-right:6px}.btn{border:1px solid var(--line);background:transparent;color:inherit;border-radius:9px;padding:6px 9px;cursor:pointer;font-size:11px}.btn:hover{background:var(--soft)}.empty{font-size:11px;opacity:.62;padding:7px 0}.footer{padding:9px 18px;font-size:10px;opacity:.5;display:flex;justify-content:space-between;gap:10px}
@media(max-width:640px){.header{flex-direction:column}.toolbar{justify-content:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stage-track{grid-template-columns:repeat(5,minmax(70px,1fr));overflow-x:auto}.signal-grid{grid-template-columns:1fr}.panel{padding:8px}.section,.header{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<div class="panel"><div class="card" id="app"><div class="section">正在等待 Agent Team 状态…</div></div></div>
<script>
const app=document.getElementById("app");
const pending=new Map();let nextId=1;let workspacePath=null;
const statusMap={idle:["等待中","○"],working:["执行中","●"],blocked:["受阻","!"],done:["已完成","✓"],failed:["失败","×"],pending:["等待依赖","○"],ready:["可执行","◆"],running:["执行中","●"]};
const phaseMap={planning:"计划",running:"执行",integrating:"整合",verifying:"验证",reviewing:"审查",completed:"完成",blocked:"受阻"};
const modeMap={NATIVE_SUBAGENTS:["原生多 Agent","🟢"],SEQUENTIAL_ROLE_FALLBACK:["顺序执行模式","🟡"],UNKNOWN:["执行模式待确认","⚪"]};
const kindMap={requirements:"需求",research:"调研",architecture:"架构",implementation:"实现",integration:"整合",verification:"验证",test:"测试",testing:"测试",review:"审查",code_review:"审查",debug:"调试",task:"任务"};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function request(method,params){const id=nextId++;window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));}
function stat(s){return statusMap[s]||[s||"未知","○"];}function phaseLabel(p){return phaseMap[p]||p||"计划";}function kindLabel(k){return kindMap[k]||k||"任务";}
function fmtTime(v){if(!v)return"";try{return new Intl.DateTimeFormat("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date(v));}catch{return String(v)}}
function statusChip(status){const [label,icon]=stat(status);return `<span class="status"><span>${icon}</span>${esc(label)}</span>`;}
function memberAvatar(name){return esc(String(name||"A").trim().slice(0,1).toUpperCase());}
function stages(phase){const defs=[["planning","计划"],["running","执行"],["verifying","验证"],["reviewing","审查"],["completed","完成"]];const idx={planning:0,running:1,integrating:1,verifying:2,reviewing:3,completed:4,blocked:1}[phase]??0;return defs.map(([,label],i)=>`<div class="stage ${i<idx?"done":""} ${i===idx?"active":""}"><span class="num">${i<idx?"✓":i+1}</span>${label}</div>`).join("");}
function taskSignal(tasks,kinds){return tasks.filter(t=>kinds.includes(t.kind));}
function signalItems(items){if(!items.length)return'<div class="empty">暂无结果</div>';return items.map(t=>`<div class="signal-item"><strong>${esc(t.id)} · ${esc(t.subject||t.objective)}</strong><div>${statusChip(t.status)} ${t.result?`<span>${esc(t.result)}</span>`:""}</div>${t.evidence?.length?`<div class="evidence">证据：${t.evidence.map(esc).join(" · ")}</div>`:""}</div>`).join("");}
function render(data){
 const team=data?.team??data;if(!team){app.innerHTML='<div class="section empty">尚未创建团队状态。</div>';return;}
 workspacePath=data?.workspacePath??team.workspacePath??workspacePath;
 const members=Array.isArray(team.members)?team.members:[];const tasks=Array.isArray(team.tasks)?team.tasks:[];const events=Array.isArray(team.events)?team.events:[];
 const done=tasks.filter(t=>t.status==="done").length;const working=members.filter(m=>m.status==="working").length;const pct=tasks.length?Math.round(done/tasks.length*100):0;const mode=modeMap[team.executionMode]||modeMap.UNKNOWN;
 const blockers=tasks.filter(t=>t.status==="blocked"||t.status==="failed");const verification=taskSignal(tasks,["verification","test","testing"]);const review=taskSignal(tasks,["review","code_review"]);
 app.innerHTML=`
 <div class="header"><div><div class="title">${esc(team.name||"Auto Agent Team")}</div><div class="sub">${esc(team.description||"自动编排、依赖调度、验证与审查状态")}</div></div><div class="toolbar"><span class="pill"><span class="dot ${esc(team.phase)}"></span>${esc(phaseLabel(team.phase))}</span><button class="btn" id="refresh">刷新</button></div></div>
 <div class="section"><div class="grid"><div class="metric"><b>${members.length}</b><span>团队成员</span></div><div class="metric"><b>${working}</b><span>执行中</span></div><div class="metric"><b>${done}/${tasks.length}</b><span>任务完成</span></div><div class="metric mode"><b>${mode[1]} ${esc(mode[0])}</b><span>执行模式</span></div></div><div class="progress-wrap"><div class="progress-top"><strong>总体进度 ${pct}%</strong><span>${done} / ${tasks.length} 已完成</span></div><div class="progress"><i style="width:${pct}%"></i></div></div></div>
 <div class="section"><div class="section-title"><span>执行阶段</span><small>${esc(phaseLabel(team.phase))}</small></div><div class="stage-track">${stages(team.phase)}</div></div>
 <div class="section"><div class="section-title"><span>成员与状态</span><small>${working} 个正在执行</small></div><div class="member-list">${members.length?members.map(m=>`<details class="member" ${m.status==="working"?"open":""}><summary><span class="avatar">${memberAvatar(m.name||m.id)}</span><span><span class="name">${esc(m.name||m.id)}</span><span class="meta">${esc(m.role||"")}${m.agentProfile?` · ${esc(m.agentProfile)}`:""}</span></span>${statusChip(m.status)}</summary><div class="member-body"><div><b>当前任务：</b>${m.currentTask?esc(m.currentTask):"暂无"}</div>${m.summary?`<div><b>状态：</b>${esc(m.summary)}</div>`:""}</div></details>`).join(""):'<div class="empty">暂无成员</div>'}</div></div>
 <div class="section"><div class="section-title"><span>任务与依赖</span><small>${tasks.length} 个任务</small></div><div class="task-list">${tasks.length?tasks.map(t=>`<div class="task"><div class="task-head"><span class="task-id">${esc(t.id)}</span><span class="task-subject" title="${esc(t.subject||t.objective)}">${esc(t.subject||t.objective)}</span>${statusChip(t.status)}</div><div class="task-detail">负责人：${esc(t.assignee||"未分配")} · ${esc(kindLabel(t.kind))}</div>${t.dependencies?.length?`<div class="task-detail">依赖：${t.dependencies.map(d=>`<span class="dep">← ${esc(d)}</span>`).join("")}</div>`:""}${t.blockedBy?.length?`<div class="blocked-note">被依赖阻塞：${t.blockedBy.map(esc).join("、")}</div>`:""}${t.result?`<div class="result"><b>结果：</b>${esc(t.result)}${t.evidence?.length?`<div class="evidence">证据：${t.evidence.map(esc).join(" · ")}</div>`:""}</div>`:""}</div>`).join(""):'<div class="empty">暂无任务</div>'}</div></div>
 ${blockers.length?`<div class="section"><div class="section-title"><span>阻塞与失败</span><small>${blockers.length}</small></div>${blockers.map(t=>`<div class="blocked-note"><b>${esc(t.id)} · ${esc(t.subject)}</b><div>${t.blockedBy?.length?`依赖：${t.blockedBy.map(esc).join("、")}`:esc(t.result||"需要处理")}</div></div>`).join("")}</div>`:""}
 <div class="section"><div class="section-title"><span>验证与审查</span><small>工程证据</small></div><div class="signal-grid"><div class="signal"><h4>测试 / Verification</h4>${signalItems(verification)}</div><div class="signal"><h4>Review</h4>${signalItems(review)}</div></div></div>
 <div class="section"><div class="section-title"><span>最近活动</span><small>自动刷新</small></div><div class="event-list">${events.length?events.slice(-10).reverse().map(e=>`<div class="event"><time>${esc(fmtTime(e.at))}</time>${esc(e.message||e.kind||"")}</div>`).join(""):'<div class="empty">暂无事件</div>'}</div></div>
 <div class="footer"><span>Auto Agent Team Runtime</span><span>更新时间 ${esc(fmtTime(team.updatedAt))}</span></div>`;
 document.getElementById("refresh")?.addEventListener("click",refresh);
}
async function refresh(){if(!workspacePath)return;try{const res=await request("tools/call",{name:"agent_team_get",arguments:{workspacePath}});if(res?.structuredContent)render(res.structuredContent);}catch(e){console.error(e);}}
window.addEventListener("message",event=>{if(event.source!==window.parent)return;const msg=event.data;if(!msg||msg.jsonrpc!=="2.0")return;if(msg.id!==undefined&&pending.has(msg.id)){const p=pending.get(msg.id);pending.delete(msg.id);msg.error?p.reject(msg.error):p.resolve(msg.result);return;}if(msg.method==="ui/notifications/tool-input")workspacePath=msg.params?.workspacePath??workspacePath;if(msg.method==="ui/notifications/tool-result"){const out=msg.params?.structuredContent;if(out)render(out);}},{passive:true});
if(window.openai?.toolOutput)render(window.openai.toolOutput);setInterval(()=>{if(workspacePath)refresh();},3000);
</script>
</body>
</html>
