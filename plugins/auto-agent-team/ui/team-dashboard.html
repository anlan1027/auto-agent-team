<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Auto Agent Team</title>
<style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--line:color-mix(in srgb,CanvasText 14%,transparent);--soft:color-mix(in srgb,CanvasText 6%,transparent);--green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--slate:#94a3b8}*{box-sizing:border-box}body{margin:0;background:transparent;color:CanvasText}.panel{max-width:900px;margin:auto;padding:14px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:color-mix(in srgb,Canvas 97%,CanvasText 3%)}.header,.section{padding:14px 17px;border-bottom:1px solid var(--line)}.header{display:flex;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:760}.sub,.meta,.detail,.event,.footer{font-size:10.5px;opacity:.68;line-height:1.45}.pill,.status{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-size:10.5px;background:var(--soft)}.btn{border:1px solid var(--line);background:transparent;color:inherit;border-radius:9px;padding:6px 9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.metric{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.metric b{display:block;font-size:17px}.metric span{font-size:10px;opacity:.65}.notice{margin-top:9px;padding:9px 10px;border-radius:11px;font-size:11px;line-height:1.5}.notice.waiting{border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));background:color-mix(in srgb,var(--amber) 8%,transparent)}.notice.error{border:1px solid color-mix(in srgb,var(--red) 55%,var(--line));background:color-mix(in srgb,var(--red) 9%,transparent)}.notice.ok{border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));background:color-mix(in srgb,var(--green) 7%,transparent)}.progress{height:8px;margin-top:8px;border-radius:999px;overflow:hidden;background:var(--soft)}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}.section-title{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-bottom:9px}.members,.tasks,.agents{display:grid;gap:8px}.item{padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.name{font-size:12px;font-weight:680}.role{font-size:10px;opacity:.62;margin-top:2px}.task-id{font:650 10px ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.62;margin-right:6px}.result{margin-top:7px;padding:7px 8px;border-radius:9px;background:color-mix(in srgb,CanvasText 5%,transparent);font-size:10.5px;line-height:1.45}.event{padding:5px 0;border-top:1px solid var(--line)}.event:first-child{border-top:0}.footer{padding:9px 17px;display:flex;justify-content:space-between}.empty{font-size:11px;opacity:.62}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.header{flex-direction:column}}
</style>
</head>
<body>
<div class="panel"><div class="card" id="app"><div class="section">正在等待 Agent Team 状态…</div></div></div>
<script>
const app=document.getElementById('app');const pending=new Map();let nextId=1;let workspacePath=null;
const statusMap={idle:['等待中','○'],working:['执行中','●'],blocked:['受阻','!'],done:['已完成','✓'],failed:['失败','×'],pending:['等待依赖','○'],ready:['可执行','◆'],running:['执行中','●'],cancelled:['已取消','−']};
const phaseMap={planning:'计划',running:'执行',integrating:'整合',verifying:'验证',reviewing:'审查',completed:'完成',blocked:'受阻'};
const teamMap={NATIVE_SUBAGENTS:{label:'Agent Team 已建立',icon:'🟢',cls:'ok',detail:'正在使用真实 Codex 原生子智能体协作。'},UNKNOWN:{label:'正在建立 Agent Team',icon:'⚪',cls:'waiting',detail:'尚未证明原生子智能体委派成功；此状态应当是短暂的启动阶段。'},SEQUENTIAL_ROLE_FALLBACK:{label:'Agent Team 未建立',icon:'🔴',cls:'error',detail:'原生子智能体不可用或真实委派失败。当前若继续执行，只是单 Agent 保底，不算多 Agent 协作。'}};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function request(method,params){const id=nextId++;window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));}
function chip(s){const [label,icon]=statusMap[s]||[s||'未知','○'];return `<span class="status">${icon} ${esc(label)}</span>`;}
function fmt(v){if(!v)return'';try{return new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(v));}catch{return String(v)}}
function render(data){const team=data?.team??data;if(!team){app.innerHTML='<div class="section empty">尚未创建团队状态。</div>';return;}workspacePath=data?.workspacePath??workspacePath;const members=team.members||[];const tasks=team.tasks||[];const agents=team.nativeAgents||[];const events=team.events||[];const active=agents.filter(a=>a.status==='running');const done=tasks.filter(t=>t.status==='done').length;const working=members.filter(m=>m.status==='working').length;let pct=tasks.length?Math.round(done/tasks.length*100):0;if(active.length&&pct===100)pct=99;const ts=teamMap[team.executionMode]||teamMap.UNKNOWN;
const teamNotice=`<div class="notice ${ts.cls}"><b>${ts.icon} ${esc(ts.label)}</b><div>${esc(ts.detail)}</div>${team.executionMode==='SEQUENTIAL_ROLE_FALLBACK'?'<div><b>注意：</b>这次运行不能宣称为成功的 Agent Team；只有软件任务可能通过单上下文保底继续完成。</div>':''}</div>`;
app.innerHTML=`<div class="header"><div><div class="title">${esc(team.name||'Auto Agent Team')}</div><div class="sub">${esc(team.description||'原生多 Agent 编排、任务依赖、验证与审查')}</div></div><div><span class="pill">${esc(phaseMap[team.phase]||team.phase||'未知')}</span> <button id="refresh" class="btn">刷新</button></div></div>
<div class="section"><div class="grid"><div class="metric"><b>${members.length}</b><span>逻辑成员</span></div><div class="metric"><b>${active.length}</b><span>原生 Agent 运行中</span></div><div class="metric"><b>${agents.length}</b><span>原生 Agent 已记录</span></div><div class="metric"><b>${working}</b><span>成员执行中</span></div><div class="metric"><b>${done}/${tasks.length}</b><span>任务完成</span></div></div>${teamNotice}<div class="detail" style="margin-top:10px"><b>总体进度 ${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div>${active.length?`<div class="notice waiting">仍有 ${active.length} 个原生子智能体运行中，不能进入最终完成状态。</div>`:''}</div>
<div class="section"><div class="section-title"><span>原生子智能体</span><span class="meta">${active.length} 运行中 / ${agents.length} 已记录</span></div><div class="agents">${agents.length?agents.slice().reverse().map(a=>`<div class="item"><div class="head"><div><div class="name">${esc(a.name||a.id)}</div><div class="role">${esc(a.role||'Subagent')}${a.taskId?` · ${esc(a.taskId)}`:''}</div></div>${chip(a.status)}</div><div class="detail">${esc(a.summary||'')}${a.startedAt?` · 开始 ${esc(fmt(a.startedAt))}`:''}${a.finishedAt?` · 结束 ${esc(fmt(a.finishedAt))}`:''}</div>${a.result?`<div class="result"><b>结果：</b>${esc(a.result)}${a.evidence?.length?`<div class="detail">证据：${a.evidence.map(esc).join(' · ')}</div>`:''}</div>`:''}</div>`).join(''):'<div class="empty">尚未记录原生子智能体。若长期停留在这里且状态为 UNKNOWN，应先尝试真实 native delegation。</div>'}</div></div>
<div class="section"><div class="section-title"><span>逻辑成员</span><span class="meta">${members.length} 个</span></div><div class="members">${members.length?members.map(m=>`<div class="item"><div class="head"><div><div class="name">${esc(m.name||m.id)}</div><div class="role">${esc(m.role||'')}</div></div>${chip(m.status)}</div><div class="detail">当前任务：${esc(m.currentTask||'暂无')}${m.summary?` · ${esc(m.summary)}`:''}</div></div>`).join(''):'<div class="empty">暂无逻辑成员。Assigned tasks 应当对应真实逻辑成员。</div>'}</div></div>
<div class="section"><div class="section-title"><span>任务与依赖</span><span class="meta">${tasks.length} 个</span></div><div class="tasks">${tasks.length?tasks.map(t=>`<div class="item"><div class="head"><div><span class="task-id">${esc(t.id)}</span><span class="name">${esc(t.subject||t.objective)}</span></div>${chip(t.status)}</div><div class="detail">负责人：${esc(t.assignee||'未分配')} · 类型：${esc(t.kind||'task')}${t.dependencies?.length?` · 依赖：${t.dependencies.map(esc).join('、')}`:''}</div>${t.result?`<div class="result"><b>结果：</b>${esc(t.result)}${t.evidence?.length?`<div class="detail">证据：${t.evidence.map(esc).join(' · ')}</div>`:''}</div>`:''}</div>`).join(''):'<div class="empty">暂无任务</div>'}</div></div>
<div class="section"><div class="section-title"><span>最近活动</span><span class="meta">自动刷新</span></div>${events.length?events.slice(-12).reverse().map(e=>`<div class="event">${esc(fmt(e.at))} · ${esc(e.message||e.kind||'')}</div>`).join(''):'<div class="empty">暂无事件</div>'}</div><div class="footer"><span>Auto Agent Team Runtime</span><span>更新时间 ${esc(fmt(team.updatedAt))}</span></div>`;document.getElementById('refresh')?.addEventListener('click',refresh);}
async function refresh(){if(!workspacePath)return;try{const r=await request('tools/call',{name:'agent_team_get',arguments:{workspacePath}});if(r?.structuredContent)render(r.structuredContent);}catch(e){console.error(e)}}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const msg=event.data;if(!msg||msg.jsonrpc!=='2.0')return;if(msg.id!==undefined&&pending.has(msg.id)){const p=pending.get(msg.id);pending.delete(msg.id);msg.error?p.reject(msg.error):p.resolve(msg.result);return;}if(msg.method==='ui/notifications/tool-input')workspacePath=msg.params?.workspacePath??workspacePath;if(msg.method==='ui/notifications/tool-result'&&msg.params?.structuredContent)render(msg.params.structuredContent);},{passive:true});
if(window.openai?.toolOutput)render(window.openai.toolOutput);setInterval(()=>{if(workspacePath)refresh();},3000);
</script>
</body>
</html>
