name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check MCP runtime syntax
        run: node --check plugins/auto-agent-team/mcp/server.mjs

      - name: Check adaptive MCP syntax
        run: node --check plugins/auto-agent-team/mcp/adaptive-server.mjs

      - name: Run full verification suite
        run: node plugins/auto-agent-team/scripts/verify-all.mjs
