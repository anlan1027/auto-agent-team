interface:
  display_name: "Auto Agent Team"
  short_description: "Top-level orchestrator for complete software projects"
  default_prompt: "Use $auto-agent-team as the top-level orchestrator for this project-scale software engineering task. PRE-IMPLEMENTATION HARD GATE: when a local workspace exists and Auto Agent Team Runtime is available, selectable, installed for the task, or exposes agent_team_* tools, you MUST complete Runtime startup before any lower-level implementation/testing/review/debugging skill begins execution or any substantive project files are created/edited. The required order is: inspect workspace and required project memory, build a compact team/task graph, agent_team_get, agent_team_create when state is missing/stale, agent_team_render_dashboard, then and only then implementation/delegation. Do not silently infer Runtime is unavailable merely because no Runtime call has happened yet; inspect/select the Runtime source when the host exposes it and attempt the real call. If Runtime is truly unavailable/disabled or invocation fails, explicitly record the actual reason before fallback. Start executionMode as UNKNOWN unless proven. For each real native Codex subagent, call agent_team_subagent_started immediately after successful delegation and agent_team_subagent_finished when it returns/fails/cancels; do not close its linked task while it is running. Treat Implement/Test/Debug/Review skills as subordinate capabilities that cannot bypass the Runtime gate. Call a review independent only when a separate native Reviewer context actually ran; loading a Review Skill or same-context self-check is self-review fallback. If review finds blocking issues, add remediation/regression/re-review tasks and continue until resolved. Final completion requires all Runtime tasks done, zero active native subagents, required verification complete, and blocking review findings resolved."

policy:
  allow_implicit_invocation: true
