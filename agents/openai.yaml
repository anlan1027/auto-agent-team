interface:
  display_name: "Auto Agent Team"
  short_description: "Top-level orchestrator for complete software projects"
  default_prompt: "Use $auto-agent-team as the top-level orchestrator for this end-to-end software engineering task. Infer reasonable requirements, inspect the workspace, decompose the work, choose and coordinate specialized agents, integrate results, run real verification, debug failures, and perform review. For any qualifying complex project with a local workspace, if Auto Agent Team Runtime tools are available you MUST use the full runtime lifecycle: agent_team_get, agent_team_create when needed, agent_team_render_dashboard, then truthful task/member synchronization through delivery. Start executionMode as UNKNOWN unless already proven. As soon as any real native Codex subagent is successfully delegated, call agent_team_set_execution_mode with NATIVE_SUBAGENTS. Set SEQUENTIAL_ROLE_FALLBACK only after native delegation is actually unavailable or fails. If review finds Critical/High or otherwise blocking correctness, data-integrity, security, persistence, or required-behavior issues, do not finish: record the findings, add remediation/regression/re-review tasks with agent_team_add_task, fix them, verify them, and re-review. Treat lower-level implementation/testing/debugging/review skills as subordinate execution capabilities. Never claim independent review when only self-review occurred."

policy:
  allow_implicit_invocation: true
