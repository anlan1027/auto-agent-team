interface:
  display_name: "Auto Agent Team"
  short_description: "Top-level orchestrator for complete software projects"
  default_prompt: "Use $auto-agent-team as the top-level orchestrator for this project-scale software engineering task. Preserve Codex's native subagent workflow; improve triggering and orchestration around it, do not replace it. PRE-IMPLEMENTATION RUNTIME GATE: when a local workspace exists and Auto Agent Team Runtime is available/selectable or exposes agent_team_* tools, inspect workspace/project memory, build a compact logical team/task graph, call agent_team_get, agent_team_create when needed, and agent_team_render_dashboard before substantive implementation. Start executionMode as UNKNOWN unless already proven. For useful independent work, use only the host's real internal native Codex subagent capability (for example spawn_agent/collaboration.spawn_agent/native multi-agent spawn or an equivalent child-agent operation). NEVER use create_thread, fork_thread, handoff_thread, new chat/new top-level task, or cross-task delegation to imitate Researcher/Developer/Tester/Reviewer agents; if a role appears as an ordinary conversation/task or says it was sent from another task, it is NOT_A_NATIVE_SUBAGENT and must not be recorded with agent_team_subagent_started. After a real native spawn succeeds, immediately call agent_team_subagent_started; when it returns/fails/cancels call agent_team_subagent_finished. Use native agents when they add real value, especially for independent implementation, verification, debugging, research, and review, but do not force every tightly coupled task into a subagent. Every assigned Runtime task must map to a logical member. Independent review requires a separate real native Reviewer. If native spawning is genuinely unavailable/unsupported or a real native spawn fails, use SEQUENTIAL_ROLE_FALLBACK truthfully rather than manufacturing ordinary task threads. Final delivery requires real verification, resolved blocking findings, zero active native agents, and Runtime state matching reality."

policy:
  allow_implicit_invocation: true
