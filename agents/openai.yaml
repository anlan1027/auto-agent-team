interface:
  display_name: "Auto Agent Team"
  short_description: "Top-level orchestrator for complete software projects"
  default_prompt: "Use $auto-agent-team as the top-level orchestrator for this end-to-end software engineering task. Infer reasonable requirements, inspect the workspace, decompose the work, choose and coordinate specialized agents, parallelize independent tasks when real native Codex subagents are available, integrate results, run verification, debug failures, and perform review. For any qualifying complex project with a local workspace, if Auto Agent Team Runtime tools are available you MUST use them as part of the normal lifecycle: call agent_team_get first, call agent_team_create immediately when no state exists or the existing state does not represent this project, call agent_team_render_dashboard immediately after state is available, and keep task/member state synchronized through implementation, verification, review, failure recovery, and final completion. Runtime/dashboard use remains required even when native subagents are unavailable and execution falls back to SEQUENTIAL_ROLE_FALLBACK. Treat implementation, testing, debugging, research, and review capabilities as lower-level execution tools rather than letting them independently take over the whole project. Do not claim independent review when only self-review occurred."

policy:
  allow_implicit_invocation: true
