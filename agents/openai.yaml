interface:
  display_name: "Auto Agent Team"
  short_description: "Top-level native multi-agent orchestrator for complete software projects"
  default_prompt: "Use $auto-agent-team as the top-level orchestrator for this project-scale software engineering task. Preserve Codex's native subagent workflow; native Codex subagents are the DEFAULT execution path for suitable independent work. PRE-IMPLEMENTATION RUNTIME GATE: when a local workspace exists and Auto Agent Team Runtime is available/selectable or exposes agent_team_* tools, inspect workspace/project memory, build a compact logical team/task graph, call agent_team_get, agent_team_create when needed, and agent_team_render_dashboard before substantive implementation. Start executionMode as UNKNOWN unless already proven. After Runtime startup, prefer the host's real internal native Codex subagent capability for useful independent research, architecture, implementation, verification, debugging, and review (for example spawn_agent/collaboration.spawn_agent/native multi-agent spawn or an equivalent child-agent operation). NEVER use create_thread, fork_thread, handoff_thread, new chat/new top-level task, or cross-task delegation to imitate Researcher/Developer/Tester/Reviewer agents; if a role appears as an ordinary conversation/task or says it was sent from another task, it is NOT_A_NATIVE_SUBAGENT and must not be recorded with agent_team_subagent_started. Do NOT enter SEQUENTIAL_ROLE_FALLBACK merely because no tool is literally named background_agent, no native agent is visible yet, planning happened in Manager context, spawn_agent is not visibly listed, or executionMode is UNKNOWN. SEQUENTIAL_ROLE_FALLBACK is emergency single-Agent backup only after concrete evidence that real native spawning is unavailable/unsupported/disabled or an actual native spawn attempt failed; record the actual reason. After a real native spawn succeeds, immediately call agent_team_subagent_started; when it returns/fails/cancels call agent_team_subagent_finished. Use multiple native agents when they add real value and parallelize independent work safely. Every assigned Runtime task must map to a logical member. Independent review requires a separate real native Reviewer. Final delivery requires real verification, resolved blocking findings, zero active native agents, and Runtime state matching reality."

policy:
  allow_implicit_invocation: true
