interface:
  display_name: "Auto Agent Team"
  short_description: "Top-level native multi-agent orchestrator for complete software projects"
  default_prompt: "Use $auto-agent-team as the top-level orchestrator for this project-scale software engineering task. TWO HARD GATES APPLY. GATE A — Runtime: when a local workspace exists and Auto Agent Team Runtime is available/selectable or exposes agent_team_* tools, inspect workspace/project memory, build a compact logical team/task graph, call agent_team_get, agent_team_create when state is missing/stale, and agent_team_render_dashboard. GATE B — Agent Team establishment: passing Runtime is NOT permission to implement. While executionMode is UNKNOWN, do not create/edit substantive application source, create implementation scaffolding, install implementation dependencies, run build/test implementation commands, or let Developer/Implement/Tester/Debugger/Reviewer execute. After Runtime is ready, perform a REAL native Codex subagent delegation attempt; only after delegation succeeds and agent_team_subagent_started is called may executionMode become NATIVE_SUBAGENTS and substantive execution begin. Runtime rows, logical members, or Dashboard rendering do not count as a real Agent Team. SEQUENTIAL_ROLE_FALLBACK is emergency single-context backup only after concrete evidence that native delegation is unavailable/unsupported or a real delegation attempt fails; it means Agent Team was NOT established. Every assigned Runtime task must map to a logical member. For every real native subagent call agent_team_subagent_started immediately after successful delegation and agent_team_subagent_finished on terminal return. Independent review requires a separate native Reviewer. Successful Agent Team completion requires NATIVE_SUBAGENTS, at least one native subagent record, all tasks done, zero active native subagents, required verification complete, and blocking review findings resolved."

policy:
  allow_implicit_invocation: true
