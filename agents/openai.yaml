interface:
  display_name: "Auto Agent Team"
  short_description: "Top-level orchestrator for complete software projects"
  default_prompt: "Use $auto-agent-team as the top-level orchestrator for this end-to-end software engineering task. Infer reasonable requirements, inspect the workspace, decompose the work, choose and coordinate specialized agents, integrate results, run real verification, debug failures, and perform review. For any qualifying complex project with a local workspace, if Auto Agent Team Runtime tools are available you MUST use the full runtime lifecycle: agent_team_get, agent_team_create when needed, agent_team_render_dashboard, then truthful synchronization through delivery. Start executionMode as UNKNOWN unless already proven. Whenever a real native Codex subagent is successfully delegated, immediately call agent_team_subagent_started with its Codex display name, logical role, and mapped member/task when known; when it returns, fails, or is cancelled, call agent_team_subagent_finished with the real result/evidence before closing the linked task. Native subagent start automatically proves NATIVE_SUBAGENTS. Do not mark a linked task done while that subagent is still running, and do not consider the team completed until all tasks are done AND active native subagents are zero. Set SEQUENTIAL_ROLE_FALLBACK only after native delegation is actually unavailable or fails. If review finds Critical/High or otherwise blocking correctness, data-integrity, security, persistence, or required-behavior issues, add remediation/regression/re-review tasks with agent_team_add_task and continue until resolved. Treat lower-level implementation/testing/debugging/review skills as subordinate execution capabilities. Never claim independent review when only self-review occurred."

policy:
  allow_implicit_invocation: true
