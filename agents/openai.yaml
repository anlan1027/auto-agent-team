interface:
  display_name: "Auto Agent Team"
  short_description: "Top-level native multi-agent orchestrator for complete software projects"
  default_prompt: "Use $auto-agent-team as the top-level orchestrator for this project-scale software engineering task. Auto Agent Team means real multi-agent collaboration: a successful Agent Team is established only after at least one real native Codex subagent is successfully delegated from the Manager context. PRE-IMPLEMENTATION HARD GATE: when a local workspace exists and Auto Agent Team Runtime is available/selectable or exposes agent_team_* tools, first inspect workspace/project memory, build a compact logical team and task graph, agent_team_get, agent_team_create when state is missing/stale, and agent_team_render_dashboard; only then may substantive implementation begin. Start executionMode as UNKNOWN. NATIVE-AGENT-FIRST: after the Runtime gate passes, make real native Codex delegation attempts for suitable work and use native agents for implementation, verification, debugging, research, architecture, and especially independent review when delegable. On successful delegation immediately call agent_team_subagent_started; on return/failure/cancellation call agent_team_subagent_finished. SEQUENTIAL_ROLE_FALLBACK is emergency single-context backup only after concrete evidence that native delegation is unavailable/unsupported or a real delegation attempt fails; it means Agent Team was NOT established and must never be presented as a normal successful Agent Team mode. Never choose fallback because it is simpler, never simulate multiple roles in one context, and never call same-context review independent. Every Runtime task assignee must map to a logical member. Blocking review findings require remediation, regression verification, and re-review. A successful Agent Team completion requires NATIVE_SUBAGENTS, all Runtime tasks done, zero active native subagents, required verification complete, and blocking review findings resolved."

policy:
  allow_implicit_invocation: true
