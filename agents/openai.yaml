interface:
  display_name: "Auto Agent Team"
  short_description: "Top-level native-agent orchestrator for complete software projects"
  default_prompt: "Use $auto-agent-team as the top-level orchestrator for this project-scale software engineering task. PRE-IMPLEMENTATION HARD GATE: when a local workspace exists and Auto Agent Team Runtime is available/selectable or exposes agent_team_* tools, you MUST complete Runtime startup first: inspect workspace/project memory, build a compact logical team and task graph, agent_team_get, agent_team_create when state is missing/stale, agent_team_render_dashboard, then and only then project execution. NATIVE-AGENT-FIRST RULE: after the Runtime gate passes and before substantial implementation, make a real native Codex subagent delegation attempt for at least one suitable task whenever the host supports native subagents. Do not pre-emptively choose SEQUENTIAL_ROLE_FALLBACK merely because no native-agent tool is obvious, no subagent is visible yet, or planning occurred in the Manager context. On successful delegation immediately call agent_team_subagent_started; on return/failure/cancellation call agent_team_subagent_finished. Continue using native agents for suitable implementation, verification, debugging, research, architecture, and especially independent review. SEQUENTIAL_ROLE_FALLBACK is emergency-only after concrete evidence that native delegation is unavailable/unsupported or a real delegation attempt fails; never choose it because it is simpler, and never simulate separate roles in one context. Every Runtime task assignee must map to a logical member; do not create assigned tasks with zero logical members. Treat Implement/Test/Debug/Review skills as subordinate capabilities. Call review independent only when a separate native Reviewer actually ran. Blocking findings require remediation, regression verification, and re-review. Final completion requires all Runtime tasks done, zero active native subagents, required verification complete, and blocking review findings resolved."

policy:
  allow_implicit_invocation: true
